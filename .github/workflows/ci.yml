name: CI - Build and Push
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT: ${{ vars.PROJECT || 'marketly' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test configuration
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\nSHARED_SECRET=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 32)" > .env
      - name: Build all four images and start PostgreSQL
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Test complete application flow
        run: python3 tests/smoke.py
      - name: PostgreSQL concurrency and product mutation tests
        run: docker compose exec -T catalog-service python < tests/catalog.py
      - name: Backend health checks
        run: |
          for svc in auth-service catalog-service orders-service; do
            docker compose exec -T "$svc" python -c 'import app; assert app.app.test_client().get("/health").status_code == 200'
          done
      - name: Configure AWS using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push the tested images with immutable commit tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in auth-service catalog-service orders-service frontend; do
            image=$(docker compose images -q "$service")
            target="$REGISTRY/$PROJECT/$service:$GITHUB_SHA"
            docker tag "$image" "$target"
            if ! aws ecr describe-images --repository-name "$PROJECT/$service" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
              docker push "$target"
            fi
          done
      - name: Failure logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Clean up
        if: always()
        run: docker compose down -v
