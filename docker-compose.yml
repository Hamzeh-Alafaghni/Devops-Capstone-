services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: marketly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: marketly
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U marketly -d marketly"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://marketly:${POSTGRES_PASSWORD}@postgres:5432/marketly
      SHARED_SECRET: ${SHARED_SECRET:?Set SHARED_SECRET in .env}
      CATALOG_SERVICE_URL: http://catalog-service:5002
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  catalog-service:
    build: ./services/catalog-service
    environment:
      DATABASE_URL: postgresql://marketly:${POSTGRES_PASSWORD}@postgres:5432/marketly
      SHARED_SECRET: ${SHARED_SECRET:?Set SHARED_SECRET in .env}
      CATALOG_SERVICE_URL: http://catalog-service:5002
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  orders-service:
    build: ./services/orders-service
    environment:
      DATABASE_URL: postgresql://marketly:${POSTGRES_PASSWORD}@postgres:5432/marketly
      SHARED_SECRET: ${SHARED_SECRET:?Set SHARED_SECRET in .env}
      CATALOG_SERVICE_URL: http://catalog-service:5002
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
volumes:
  pgdata:
