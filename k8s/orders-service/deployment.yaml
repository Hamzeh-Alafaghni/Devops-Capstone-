apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: 678419966897.dkr.ecr.us-east-1.amazonaws.com/devops-orders:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003
        env:
        - name: SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: orders-secrets
              key: SHARED_SECRET
        - name: CATALOG_URL
          value: "http://catalog:5002"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
